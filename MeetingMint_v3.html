<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title id="pageTitle">Meeting Mint — Paid to Nod Along</title>
  <style>
    :root {
      --bg: #0b0f14;
      --card: #131922;
      --card-2: #1a222e;
      --border: #263142;
      --text: #f3f7fb;
      --muted: #8a99ad;
      --mint: #10b981;
      --mint-bright: #34d399;
      --mint-soft: rgba(16, 185, 129, 0.15);
      --amber: #f59e0b;
      --danger: #f87171;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      background-image: radial-gradient(circle at 50% -10%, rgba(16, 185, 129, 0.14), transparent 60%);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: 14px 14px 32px;
    }

    .app {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand h1 {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand p {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .sound-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      padding: 8px 11px;
      min-height: 40px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      touch-action: manipulation;
    }

    .sound-btn.on {
      color: var(--mint-bright);
      border-color: rgba(16, 185, 129, 0.45);
      background: var(--mint-soft);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
    }

    /* Currency Pills: SGD -> TWD -> USD */
    .curr-pills {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .curr-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      padding: 9px 6px;
      min-height: 42px;
      font-family: var(--mono);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.14s ease;
    }

    .curr-pill.active {
      background: var(--mint-soft);
      border-color: var(--mint);
      color: var(--mint-bright);
    }

    .inputs-grid {
      display: grid;
      grid-template-columns: 1.35fr 0.82fr 0.83fr;
      gap: 8px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .field input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 10px;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .field input:focus {
      outline: none;
      border-color: var(--mint);
    }

    .rate-line {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
      color: var(--muted);
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }

    .rate-line strong {
      color: var(--mint-bright);
    }

    /* Main Cents Ticker */
    .ticker-card {
      text-align: center;
      padding: 20px 14px 18px;
      border-color: rgba(16, 185, 129, 0.28);
    }

    .ticker-card.running {
      border-color: rgba(16, 185, 129, 0.6);
      box-shadow: 0 10px 28px rgba(16, 185, 129, 0.12);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .ticker-card.running .status-badge {
      color: var(--mint-bright);
      border-color: rgba(16, 185, 129, 0.45);
      background: var(--mint-soft);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
    }

    .ticker-card.running .dot {
      background: var(--mint-bright);
      box-shadow: 0 0 8px var(--mint-bright);
    }

    .timer {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .ticker-card.running .timer {
      color: var(--text);
    }

    /* Cents-only display: e.g. $0.10 / S$0.10 / NT$0.10 */
    .cents-amount {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.6rem, 12vw, 3.6rem);
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.02em;
      color: var(--mint-bright);
      margin: 4px 0 14px;
      word-break: break-word;
    }

    .perk-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: left;
      margin-bottom: 14px;
    }

    .perk-text {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 7px;
    }

    .perk-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--muted);
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      margin-bottom: 4px;
    }

    .bar {
      height: 6px;
      background: var(--card-2);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--mint), var(--mint-bright));
      transition: width 0.15s linear;
    }

    .actions {
      display: grid;
      grid-template-columns: 1.4fr 0.8fr 1fr;
      gap: 8px;
    }

    .btn {
      min-height: 48px;
      border-radius: 12px;
      border: 1px solid transparent;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      touch-action: manipulation;
      transition: transform 0.08s ease, opacity 0.15s ease;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .btn-go {
      background: var(--mint);
      color: #052e16;
    }

    .btn-stop {
      background: var(--amber);
      color: #271700;
    }

    .btn-reset {
      background: var(--card-2);
      border-color: var(--border);
      color: var(--text);
      font-size: 0.82rem;
    }

    .btn-save {
      background: var(--mint-soft);
      border-color: rgba(16, 185, 129, 0.45);
      color: var(--mint-bright);
      font-size: 0.82rem;
    }

    .log-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .log-head h2 {
      font-size: 0.92rem;
      font-weight: 700;
    }

    .log-total {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--mint-bright);
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 190px;
      overflow-y: auto;
    }

    .log-empty {
      text-align: center;
      padding: 14px;
      font-size: 0.8rem;
      color: var(--muted);
      background: var(--bg);
      border-radius: 10px;
      border: 1px dashed var(--border);
    }

    .log-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.8rem;
    }

    .log-sub {
      font-size: 0.7rem;
      color: var(--muted);
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }

    .log-amt {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--mint-bright);
    }

    .log-actions {
      margin-top: 8px;
      display: flex;
      justify-content: flex-end;
    }

    .clear-link {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.74rem;
      cursor: pointer;
      padding: 4px 6px;
    }

    .clear-link:hover {
      color: var(--danger);
    }

    .toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--card-2);
      border: 1px solid var(--mint);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 50;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <div class="brand">
        <h1 id="appTitle">Meeting Mint</h1>
        <p id="appSubtitle">Getting paid to nod along</p>
      </div>
      <button id="soundBtn" class="sound-btn on" type="button" aria-pressed="true">
        <span id="soundIcon">🔔</span>
        <span id="soundText">Sound On</span>
      </button>
    </header>

    <section class="card">
      <div class="curr-pills" role="group" aria-label="Currency">
        <button class="curr-pill active" data-curr="SGD" type="button">SGD</button>
        <button class="curr-pill" data-curr="TWD" type="button">TWD</button>
        <button class="curr-pill" data-curr="USD" type="button">USD</button>
      </div>

      <div class="inputs-grid">
        <div class="field">
          <label id="lblSalary" for="salaryInput">Monthly Salary</label>
          <input id="salaryInput" type="number" min="0" step="100" value="5000" inputmode="decimal" />
        </div>
        <div class="field">
          <label id="lblDays" for="daysInput">Days / Mo</label>
          <input id="daysInput" type="number" min="1" max="31" step="0.5" value="22" inputmode="decimal" />
        </div>
        <div class="field">
          <label id="lblHours" for="hoursInput">Hrs / Day</label>
          <input id="hoursInput" type="number" min="1" max="24" step="0.5" value="8" inputmode="decimal" />
        </div>
      </div>

      <div class="rate-line">
        <span id="rateHr">Rate: S$28.41/hr</span>
        <span id="rateMin">S$0.47/min</span>
      </div>
    </section>

    <main id="tickerCard" class="card ticker-card">
      <div class="status-badge">
        <span class="dot"></span>
        <span id="statusLabel">Ready</span>
      </div>

      <div id="timerDisplay" class="timer">00:00:00</div>
      <div id="centsDisplay" class="cents-amount">S$0.00</div>

      <div class="perk-box">
        <div id="perkMsg" class="perk-text">Tap Start when the meeting begins. Keep nodding.</div>
        <div class="perk-meta">
          <span id="perkNext">Next: Coffee (S$2.00)</span>
          <span id="perkPct">0%</span>
        </div>
        <div class="bar">
          <div id="perkBar" class="bar-fill"></div>
        </div>
      </div>

      <div class="actions">
        <button id="toggleBtn" class="btn btn-go" type="button">▶ Start</button>
        <button id="resetBtn" class="btn btn-reset" type="button" disabled>↺ Stop</button>
        <button id="logBtn" class="btn btn-save" type="button" disabled>💾 Log</button>
      </div>
    </main>

    <section class="card">
      <div class="log-head">
        <h2 id="logHeading">Logged Meetings</h2>
        <span id="logTotal" class="log-total">S$0.00</span>
      </div>
      <div id="logList" class="log-list">
        <div id="logEmpty" class="log-empty">No meetings logged yet.</div>
      </div>
      <div id="logFooter" class="log-actions" style="display: none;">
        <button id="clearBtn" class="clear-link" type="button">Clear log</button>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const STORAGE_KEY = 'meeting_mint_mobile_v2';

      const DEFAULTS_BY_CURR = {
        SGD: 5000,
        TWD: 100000,
        USD: 5000
      };

      const CURR_META = {
        SGD: { symbol: 'S$', step: 100 },
        TWD: { symbol: 'NT$', step: 1000 },
        USD: { symbol: '$', step: 100 }
      };

      const I18N = {
        en: {
          langAttr: 'en',
          pageTitle: 'Meeting Mint — Paid to Nod Along',
          appTitle: 'Meeting Mint',
          appSubtitle: 'Getting paid to nod along',
          soundOn: 'Sound On',
          soundOff: 'Muted',
          salary: 'Monthly Salary',
          days: 'Days / Mo',
          hours: 'Hrs / Day',
          ratePrefix: 'Rate',
          statusReady: 'Ready',
          statusRunning: 'Earning Live',
          statusPaused: 'Paused',
          start: '▶ Start',
          pause: '⏸ Pause',
          resume: '▶ Resume',
          stop: '⏹ Stop',
          log: '💾 Log',
          logHeading: 'Logged Meetings',
          logEmpty: 'No meetings logged yet.',
          clearLog: 'Clear log',
          confirmClear: 'Tap again to clear',
          loggedTitle: 'Survived Meeting',
          toastLogged: 'Logged {amt}!',
          toastCleared: 'Log cleared.',
          toastMinSec: 'Wait at least 1 second to log.',
          idleMsg: 'Tap Start when the meeting begins. Keep nodding.',
          maxPerk: 'Max milestone reached — pure zen.',
          nextPrefix: 'Next',
          milestones: [
            { mult: 0,    perk: 'Coffee',       msg: 'Meeting started. Put on your serious nodding face.' },
            { mult: 0.04, perk: 'Snack / Toast', msg: 'Snack money earned! Nod like you deeply agree.' },
            { mult: 0.12, perk: 'Casual Lunch', msg: 'Lunch is basically paid for. Ask "Can we circle back?"' },
            { mult: 0.25, perk: 'Nice Dinner',  msg: 'Dinner fund unlocked just by sitting on a call.' },
            { mult: 0.50, perk: 'Weekend Treat', msg: 'Could have been an email, yet here you are getting paid.' },
            { mult: 1.00, perk: 'Boss Mode',    msg: 'Full-on corporate zen. You are unstoppable.' }
          ]
        },
        zh: {
          langAttr: 'zh-Hant',
          pageTitle: '開會印鈔機 — 邊點頭邊賺錢',
          appTitle: '開會印鈔機',
          appSubtitle: '坐著聽廢話也能領薪水',
          soundOn: '音效開啟',
          soundOff: '已靜音',
          salary: '月薪',
          days: '每月天數',
          hours: '每日工時',
          ratePrefix: '時薪',
          statusReady: '待命中',
          statusRunning: '薪水跳動中',
          statusPaused: '已暫停',
          start: '▶ 開始',
          pause: '⏸ 暫停',
          resume: '▶ 繼續',
          stop: '⏹ 停止',
          log: '💾 記錄',
          logHeading: '已記錄會議',
          logEmpty: '尚未記錄任何會議。',
          clearLog: '清除紀錄',
          confirmClear: '再按一次確認清除',
          loggedTitle: '撐過一場會議',
          toastLogged: '已記錄 {amt}！',
          toastCleared: '紀錄已清除。',
          toastMinSec: '至少經過 1 秒才能記錄。',
          idleMsg: '開會時按下「開始」，保持專業點頭表情。',
          maxPerk: '已達最高里程碑 — 心如止水境界。',
          nextPrefix: '下一目標',
          milestones: [
            { mult: 0,    perk: '手搖飲 / 咖啡', msg: '會議開始！準備好你的認真點頭臉。' },
            { mult: 0.04, perk: '早餐 / 點心',   msg: '點心錢到手！跟著附和一句「很有道理」。' },
            { mult: 0.12, perk: '午餐便當',     msg: '這餐午餐穩了！不妨問一句「這部分我們再對齊一下？」' },
            { mult: 0.25, perk: '餐廳大餐',     msg: '光坐在會議裡就賺到一頓好料了。' },
            { mult: 0.50, perk: '週末犒賞',     msg: '明明一封信能講完，但你在這裡領錢。' },
            { mult: 1.00, perk: '職場高僧',     msg: '完全進入躺平印鈔模式，佩服佩服。' }
          ]
        }
      };

      let state = {
        currency: 'SGD',
        salaries: { ...DEFAULTS_BY_CURR },
        days: 22,
        hours: 8,
        soundOn: true,
        history: []
      };

      let isRunning = false;
      let startWall = 0; // Date.now() when current run started — survives lock/background
      let elapsedMs = 0;
      let rafId = null;
      let tickTimer = null;
      let wakeLock = null;
      const TIMER_KEY = 'meeting-mint-timer-v1';
      let lastMilestoneIdx = 0;
      let confirmClear = false;
      let confirmTimer = null;

      // iOS Safari Web Audio state
      let audioCtx = null;
      let audioUnlocked = false;

      const dom = {
        pageTitle: document.getElementById('pageTitle'),
        appTitle: document.getElementById('appTitle'),
        appSubtitle: document.getElementById('appSubtitle'),
        soundBtn: document.getElementById('soundBtn'),
        soundIcon: document.getElementById('soundIcon'),
        soundText: document.getElementById('soundText'),
        pills: Array.from(document.querySelectorAll('.curr-pill')),
        lblSalary: document.getElementById('lblSalary'),
        lblDays: document.getElementById('lblDays'),
        lblHours: document.getElementById('lblHours'),
        salaryInput: document.getElementById('salaryInput'),
        daysInput: document.getElementById('daysInput'),
        hoursInput: document.getElementById('hoursInput'),
        rateHr: document.getElementById('rateHr'),
        rateMin: document.getElementById('rateMin'),
        tickerCard: document.getElementById('tickerCard'),
        statusLabel: document.getElementById('statusLabel'),
        timerDisplay: document.getElementById('timerDisplay'),
        centsDisplay: document.getElementById('centsDisplay'),
        perkMsg: document.getElementById('perkMsg'),
        perkNext: document.getElementById('perkNext'),
        perkPct: document.getElementById('perkPct'),
        perkBar: document.getElementById('perkBar'),
        toggleBtn: document.getElementById('toggleBtn'),
        resetBtn: document.getElementById('resetBtn'),
        logBtn: document.getElementById('logBtn'),
        logHeading: document.getElementById('logHeading'),
        logTotal: document.getElementById('logTotal'),
        logList: document.getElementById('logList'),
        logEmpty: document.getElementById('logEmpty'),
        logFooter: document.getElementById('logFooter'),
        clearBtn: document.getElementById('clearBtn'),
        toast: document.getElementById('toast')
      };

      function getLang() {
        return state.currency === 'TWD' ? 'zh' : 'en';
      }

      function t() {
        return I18N[getLang()];
      }

      function getSymbol(curr = state.currency) {
        return (CURR_META[curr] || CURR_META.SGD).symbol;
      }

      function getSalary() {
        return Math.max(0, Number(state.salaries[state.currency]) || 0);
      }

      function getPerSecond() {
        const days = Math.max(0.5, Number(state.days) || 22);
        const hours = Math.max(0.5, Number(state.hours) || 8);
        return getSalary() / (days * hours * 3600);
      }

      // Strictly down to cents: e.g. $0.10, S$0.10, NT$0.10
      function fmtCents(amount, curr = state.currency) {
        const sym = getSymbol(curr);
        const safe = Number.isFinite(amount) ? Math.max(0, amount) : 0;
        const formatted = safe.toLocaleString('en-US', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
        return `${sym}${formatted}`;
      }

      function fmtDuration(ms) {
        const sec = Math.max(0, Math.floor(ms / 1000));
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = sec % 60;
        return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
      }

      function showToast(msg) {
        dom.toast.textContent = msg;
        dom.toast.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => dom.toast.classList.remove('show'), 2200);
      }

      // --- iOS Safari Web Audio Unlock & Chime ---
      function ensureAudioContext() {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return null;

        if (!audioCtx) {
          audioCtx = new AudioCtor();
        }

        if (audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }

        // Play a silent 1-sample buffer inside user gesture to unlock iOS Safari audio output
        if (!audioUnlocked && audioCtx) {
          try {
            const buffer = audioCtx.createBuffer(1, 1, 22050);
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            source.start(0);
            audioUnlocked = true;
          } catch (_) {
            // Ignore if buffer playback is not needed or blocked
          }
        }

        return audioCtx;
      }

      function playChime() {
        if (!state.soundOn) return;
        const ctx = ensureAudioContext();
        if (!ctx) return;

        const runTone = () => {
          try {
            const now = ctx.currentTime;
            const freqs = [880, 1174.66]; // A5 -> D6 crisp chime
            freqs.forEach((f, idx) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(f, now + idx * 0.08);

              gain.gain.setValueAtTime(0.0001, now + idx * 0.08);
              gain.gain.exponentialRampToValueAtTime(0.14, now + idx * 0.08 + 0.015);
              gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.32);

              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + idx * 0.08);
              osc.stop(now + idx * 0.08 + 0.34);
            });
          } catch (_) {
            // Ignore audio errors
          }
        };

        if (ctx.state === 'suspended') {
          ctx.resume().then(runTone).catch(runTone);
        } else {
          runTone();
        }
      }

      // --- Storage ---
      function loadState() {
        try {
          const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (raw && typeof raw === 'object') {
            if (CURR_META[raw.currency]) state.currency = raw.currency;
            if (raw.salaries && typeof raw.salaries === 'object') {
              state.salaries = {
                SGD: Number(raw.salaries.SGD) >= 0 ? Number(raw.salaries.SGD) : DEFAULTS_BY_CURR.SGD,
                TWD: Number(raw.salaries.TWD) >= 0 ? Number(raw.salaries.TWD) : DEFAULTS_BY_CURR.TWD,
                USD: Number(raw.salaries.USD) >= 0 ? Number(raw.salaries.USD) : DEFAULTS_BY_CURR.USD
              };
            }
            if (Number(raw.days) > 0) state.days = Number(raw.days);
            if (Number(raw.hours) > 0) state.hours = Number(raw.hours);
            if (typeof raw.soundOn === 'boolean') state.soundOn = raw.soundOn;
            if (Array.isArray(raw.history)) state.history = raw.history;
          }
        } catch (_) {
          // Ignore storage parse issues
        }
      }

      // Persist running timer separately so a lock / reload / Safari purge
      // can resume from wall-clock time instead of losing everything.
      function saveTimer() {
        try {
          if (isRunning) localStorage.setItem(TIMER_KEY, JSON.stringify({ running: true, startWall, elapsedMs, savedAt: Date.now() }));
          else localStorage.setItem(TIMER_KEY, JSON.stringify({ running: false, elapsedMs }));
        } catch (_) {}
      }
      function restoreTimer() {
        try {
          const raw = JSON.parse(localStorage.getItem(TIMER_KEY));
          if (!raw) return;
          if (raw.running && Number(raw.startWall) > 0) {
            // Wall clock kept ticking while screen was off — catch up instantly.
            elapsedMs = Math.max(0, Number(raw.elapsedMs) || 0);
            startWall = Number(raw.startWall);
            isRunning = true;
          } else if (Number(raw.elapsedMs) > 0) {
            elapsedMs = Number(raw.elapsedMs);
          }
        } catch (_) {}
      }
      function clearTimer() { try { localStorage.removeItem(TIMER_KEY); } catch (_) {} }

      async function requestWakeLock() {
        // Best-effort only: keeps screen on while visible, so iOS doesn't
        // suspend the tab in the first place. Locking manually still works
        // because we use wall-clock time below.
        try {
          if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen');
        } catch (_) {}
      }
      function releaseWakeLock() { try { wakeLock && wakeLock.release(); } catch (_) {} wakeLock = null; }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (_) {
          // Ignore storage quota issues
        }
      }

      // --- UI Rendering ---
      function applyLocalization() {
        const tr = t();
        const meta = CURR_META[state.currency] || CURR_META.SGD;

        document.documentElement.lang = tr.langAttr;
        dom.pageTitle.textContent = tr.pageTitle;
        dom.appTitle.textContent = tr.appTitle;
        dom.appSubtitle.textContent = tr.appSubtitle;

        dom.soundBtn.classList.toggle('on', state.soundOn);
        dom.soundBtn.setAttribute('aria-pressed', String(state.soundOn));
        dom.soundIcon.textContent = state.soundOn ? '🔔' : '🔕';
        dom.soundText.textContent = state.soundOn ? tr.soundOn : tr.soundOff;

        dom.pills.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.curr === state.currency);
        });

        dom.lblSalary.textContent = tr.salary;
        dom.lblDays.textContent = tr.days;
        dom.lblHours.textContent = tr.hours;

        dom.salaryInput.step = String(meta.step);
        dom.salaryInput.value = String(getSalary());
        dom.daysInput.value = String(state.days);
        dom.hoursInput.value = String(state.hours);

        dom.logHeading.textContent = tr.logHeading;
        dom.logEmpty.textContent = tr.logEmpty;
        if (!confirmClear) {
          dom.clearBtn.textContent = tr.clearLog;
        }

        updateRates();
        updateButtons();
        renderHistory();
      }

      function updateRates() {
        const tr = t();
        const perSec = getPerSecond();
        dom.rateHr.textContent = `${tr.ratePrefix}: ${fmtCents(perSec * 3600)}/hr`;
        dom.rateMin.textContent = `${fmtCents(perSec * 60)}/min`;
      }

      function getMilestones() {
        const tr = t();
        const salary = getSalary();
        // Scale perks sensibly even if user sets a very small/large salary
        const baseUnit = salary > 0 ? salary / 1000 : 5;
        return tr.milestones.map(m => ({
          amount: m.mult === 0 ? 0 : Math.max(0.5, Number((m.mult * 100 * baseUnit).toFixed(2))),
          perk: m.perk,
          msg: m.msg
        }));
      }

      function updatePerk(earned, activeMs) {
        const tr = t();
        const list = getMilestones();
        let idx = 0;
        for (let i = list.length - 1; i >= 0; i--) {
          if (earned >= list[i].amount) {
            idx = i;
            break;
          }
        }

        if (idx > lastMilestoneIdx && activeMs > 0) {
          lastMilestoneIdx = idx;
          playChime();
        }

        const cur = list[idx];
        const next = list[idx + 1];

        dom.perkMsg.textContent = (activeMs === 0 && !isRunning) ? tr.idleMsg : cur.msg;

        if (next) {
          const span = Math.max(0.01, next.amount - cur.amount);
          const pct = Math.min(100, Math.max(0, ((earned - cur.amount) / span) * 100));
          dom.perkNext.textContent = `${tr.nextPrefix}: ${next.perk} (${fmtCents(next.amount)})`;
          dom.perkPct.textContent = `${Math.floor(pct)}%`;
          dom.perkBar.style.width = `${pct}%`;
        } else {
          dom.perkNext.textContent = tr.maxPerk;
          dom.perkPct.textContent = '100%';
          dom.perkBar.style.width = '100%';
        }
      }

      function currentMs(now = Date.now()) {
        return isRunning ? elapsedMs + (now - startWall) : elapsedMs;
      }

      function renderTick(now = Date.now()) {
        const ms = currentMs(now);
        const earned = (ms / 1000) * getPerSecond();
        const centsStr = fmtCents(earned);

        dom.timerDisplay.textContent = fmtDuration(ms);
        dom.centsDisplay.textContent = centsStr;

        if (isRunning) {
          document.title = `${centsStr} • ${t().appTitle}`;
        }

        updatePerk(earned, ms);

        // rAF stops when locked/backgrounded — it is only for smooth display.
        // The elapsed value itself comes from Date.now(), so it stays correct.
      }

      function updateButtons() {
        const tr = t();
        const hasElapsed = elapsedMs > 0 || isRunning;

        dom.tickerCard.classList.toggle('running', isRunning);

        if (isRunning) {
          dom.statusLabel.textContent = tr.statusRunning;
          dom.toggleBtn.textContent = tr.pause;
          dom.toggleBtn.className = 'btn btn-stop';
        } else if (elapsedMs > 0) {
          dom.statusLabel.textContent = tr.statusPaused;
          dom.toggleBtn.textContent = tr.resume;
          dom.toggleBtn.className = 'btn btn-go';
        } else {
          dom.statusLabel.textContent = tr.statusReady;
          dom.toggleBtn.textContent = tr.start;
          dom.toggleBtn.className = 'btn btn-go';
          document.title = tr.pageTitle;
        }

        dom.resetBtn.disabled = !hasElapsed;
        dom.logBtn.disabled = !hasElapsed;
      }

      function startTicking() {
        if (rafId) cancelAnimationFrame(rafId);
        if (tickTimer) clearInterval(tickTimer);
        const tick = () => renderTick();
        rafId = requestAnimationFrame(function loop() { tick(); if (isRunning) rafId = requestAnimationFrame(loop); });
        // setInterval keeps updating when rAF is throttled in background
        tickTimer = setInterval(tick, 1000);
      }
      function stopTicking() {
        if (rafId) cancelAnimationFrame(rafId);
        if (tickTimer) clearInterval(tickTimer);
        rafId = null; tickTimer = null;
      }

      function startTimer() {
        if (isRunning) return;
        ensureAudioContext();
        isRunning = true;
        startWall = Date.now();
        saveTimer();
        requestWakeLock();
        updateButtons();
        startTicking();
        renderTick();
      }

      function pauseTimer() {
        if (!isRunning) return;
        ensureAudioContext();
        elapsedMs += Date.now() - startWall;
        isRunning = false;
        stopTicking();
        releaseWakeLock();
        saveTimer();
        updateButtons();
        renderTick();
      }

      function stopAndResetTimer() {
        ensureAudioContext();
        isRunning = false;
        stopTicking();
        releaseWakeLock();
        elapsedMs = 0;
        lastMilestoneIdx = 0;
        clearTimer();
        updateButtons();
        renderTick();
      }

      function logMeeting() {
        ensureAudioContext();
        const ms = currentMs();
        if (ms < 1000) {
          showToast(t().toastMinSec);
          return;
        }
        const earned = (ms / 1000) * getPerSecond();
        state.history.unshift({
          id: Date.now(),
          curr: state.currency,
          earned,
          ms,
          when: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        saveState();
        playChime();
        showToast(t().toastLogged.replace('{amt}', fmtCents(earned)));
        stopAndResetTimer();
        renderHistory();
      }

      function renderHistory() {
        const tr = t();
        const matching = state.history.filter(item => item.curr === state.currency);
        const total = matching.reduce((sum, item) => sum + (Number(item.earned) || 0), 0);
        dom.logTotal.textContent = fmtCents(total);

        if (matching.length === 0) {
          dom.logList.innerHTML = '';
          dom.logList.appendChild(dom.logEmpty);
          dom.logEmpty.style.display = 'block';
          dom.logFooter.style.display = 'none';
          return;
        }

        dom.logEmpty.style.display = 'none';
        dom.logFooter.style.display = 'flex';

        dom.logList.innerHTML = matching.map(item => `
          <div class="log-row">
            <div>
              <div>${tr.loggedTitle}</div>
              <div class="log-sub">${item.when} • ${fmtDuration(item.ms)}</div>
            </div>
            <div class="log-amt">+${fmtCents(item.earned, item.curr)}</div>
          </div>
        `).join('');
      }

      // --- Events ---
      dom.soundBtn.addEventListener('click', () => {
        // Always unlock AudioContext on gesture
        ensureAudioContext();
        state.soundOn = !state.soundOn;
        saveState();
        applyLocalization();
        if (state.soundOn) {
          playChime();
        }
      });

      dom.pills.forEach(btn => {
        btn.addEventListener('click', () => {
          ensureAudioContext();
          const nextCurr = btn.dataset.curr;
          if (!CURR_META[nextCurr]) return;
          state.currency = nextCurr;
          if (typeof state.salaries[nextCurr] !== 'number' || Number.isNaN(state.salaries[nextCurr])) {
            state.salaries[nextCurr] = DEFAULTS_BY_CURR[nextCurr];
          }
          saveState();
          applyLocalization();
          renderTick();
        });
      });

      dom.salaryInput.addEventListener('input', () => {
        const val = parseFloat(dom.salaryInput.value);
        state.salaries[state.currency] = Number.isFinite(val) && val >= 0 ? val : 0;
        saveState();
        updateRates();
        renderTick();
      });

      dom.daysInput.addEventListener('input', () => {
        const val = parseFloat(dom.daysInput.value);
        state.days = Number.isFinite(val) && val > 0 ? val : 22;
        saveState();
        updateRates();
        renderTick();
      });

      dom.hoursInput.addEventListener('input', () => {
        const val = parseFloat(dom.hoursInput.value);
        state.hours = Number.isFinite(val) && val > 0 ? val : 8;
        saveState();
        updateRates();
        renderTick();
      });

      dom.toggleBtn.addEventListener('click', () => {
        if (isRunning) pauseTimer();
        else startTimer();
      });

      dom.resetBtn.addEventListener('click', stopAndResetTimer);
      dom.logBtn.addEventListener('click', logMeeting);

      dom.clearBtn.addEventListener('click', () => {
        const tr = t();
        if (!confirmClear) {
          confirmClear = true;
          dom.clearBtn.textContent = tr.confirmClear;
          clearTimeout(confirmTimer);
          confirmTimer = setTimeout(() => {
            confirmClear = false;
            dom.clearBtn.textContent = tr.clearLog;
          }, 2500);
          return;
        }
        clearTimeout(confirmTimer);
        confirmClear = false;
        state.history = state.history.filter(item => item.curr !== state.currency);
        saveState();
        showToast(tr.toastCleared);
        renderHistory();
      });

      // Init
      loadState();
      restoreTimer();
      applyLocalization();
      if (isRunning) { requestWakeLock(); startTicking(); }
      renderTick();
      // Save every 5s while running, so even a killed tab resumes correctly.
      setInterval(() => { if (isRunning) saveTimer(); }, 5000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { if (isRunning) saveTimer(); }
        else {
          // Just unlocked / back in foreground: recalc from wall clock.
          if (isRunning) { startTicking(); requestWakeLock(); }
          renderTick();
        }
      });
      window.addEventListener('pagehide', () => { if (isRunning) saveTimer(); });
    })();
  </script>
</body>
</html>
